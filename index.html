<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Статті</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f4fa;--surface:#fff;--ink:#0d1433;--muted:#5a6386;--line:#dde2ef;--coral:#d9432f}
@media (prefers-color-scheme: dark){:root{--bg:#090e22;--surface:#121935;--ink:#eef1fb;--muted:#9aa3c6;--line:#262f57;--coral:#ff806c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Golos Text",system-ui,sans-serif;font-size:17px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:56px 16px 72px}
h1{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem);margin:0 0 28px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--coral);outline:none}
.date{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--coral);font-weight:600}
.t{font-family:"Unbounded",sans-serif;font-weight:500;font-size:1.1rem;margin:4px 0}
.d{color:var(--muted);font-size:.95rem;margin:0}
</style>
</head>
<body>
<main>
  <h1>Статті</h1>
  <ul>
    <li><a class="card" href="web-summit-2026/">
      <div class="date">Листопад 2026</div>
      <div class="t">Лісабон, роботи і шторм</div>
      <p class="d">Web Summit 2026 очима учасника: три дні з чотирьох, дев’ять танцюючих роботів і шторм «Шарль».</p>
    </a></li>
  </ul>
</main>
</body>
</html>
